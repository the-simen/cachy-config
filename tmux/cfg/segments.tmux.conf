set -g @segment-session-normal \
'#[fg=#{E:@sec},bg=default]\
#{@left-edge}\
#[fg=#{E:@on-sec},bg=#{E:@sec}]\
#[bold] #S \
#[fg=#{E:@sec},bg=default]\
#{@left-separator}'

set -g @segment-session-prefix \
'#[fg=#{E:@err},bg=default]\
#{@left-edge}\
#[fg=#{E:@on-err},bg=#{E:@err}]\
#[bold]  #S \
#[fg=#{E:@err},bg=default]\
#{@left-separator}'

set -g @segment-session \
'#{?client_prefix,#{E:@segment-session-prefix},#{E:@segment-session-normal}}'

set -g @segment-session-duration \
'#[fg=#{E:@t-magenta},bg=default]\
#{@left-edge}\
#[fg=#{E:@surf},bg=#{E:@t-magenta}]\
 #[bold]󰔟 #(~/.config/tmux/scripts/session-duration.sh "#{session_created}") \
#[fg=#{E:@t-magenta},bg=#{E:@sep-color}]\
#{@left-separator}'

set -g @segment-current-directory \
'#[fg=#{E:@sep-color},bg=#{E:@t-cyan}]\
#{@left-separator}\
#[fg=#{E:@surf},bg=#{E:@t-cyan}]\
 󰉋 #{b:pane_current_path} \
#[fg=#{E:@sep-color},bg=#{E:@t-cyan}]\
#{@right-separator}'

set -g @segment-git '#(#{HOME}/.config/tmux/scripts/git-branch.sh "#{pane_current_path}")'

set -g @segment-command \
'#[fg=#{E:@sep-color},bg=#{E:@t-yellow}]\
#{@left-separator}\
#[fg=#{E:@surf},bg=#{E:@t-yellow}]\
 #{E:@command-icon} #{b:pane_current_command} \
#[fg=#{E:@sep-color},bg=#{E:@t-yellow}]\
#{@right-separator}'

set -g @segment-user \
'#[fg=#{E:@sep-color},bg=#{E:@ter-c}]\
#{@left-separator}\
#[fg=#{E:@on-ter-c},bg=#{E:@ter-c}]\
 󰀄 \
#[fg=#{E:@ter-c},bg=#{E:@ter}]\
#{@left-separator}\
#[fg=#{E:@on-ter},bg=#{E:@ter}]\
 #(whoami) \
#[fg=#{E:@ter-c},bg=#{E:@ter}]\
#{@right-separator}'

set -g @segment-host \
'#[fg=#{E:@on-ter-c},bg=#{E:@ter-c}]\
 󰇅 \
#[fg=#{E:@ter-c},bg=#{E:@ter}]\
#{@left-separator}\
#[fg=#{E:@on-ter},bg=#{E:@ter}]\
 #H \
#[fg=#{E:@ter},bg=default]\
#{@right-edge}'

set -g @segment-separator \
'#[fg=#{E:@sep-color}]\
#{@block}'
