source-file -q "$HOME/.config/tmux/cfg/colors.tmux.conf"
source-file -q "$HOME/.config/tmux/cfg/segments.tmux.conf"
source-file -q "$HOME/.config/tmux/cfg/command-icons.tmux.conf"
source-file -q "$HOME/.config/tmux/cfg/window-title.tmux.conf"

#Bar settings
set -g status on

set -g status-style "fg=white,bg=default"
set -g status-left-style "fg=white,bg=default"
set -g status-left-length 100
set -g status-right-length 100
set -g status-right-style "fg=white,bg=default"

set -g @left-edge ''
set -g @right-edge ''
set -g @left-separator ''
set -g @right-separator ''
set -g @block '█'

set -g status-left '#{E:@segment-session}'
set-option -g window-status-current-style 'default'

set -g @window-status-left \
'#[fg=#{E:@surf-br},bg=default]\
#{@right-separator}\
#[bg=#{E:@surf-br},fg=#{E:@on-surf}]\
 #{?window_zoomed_flag,󱡴,#I} \
#[fg=#{E:@surf-br},bg=#{E:@surf-v}]\
#{@left-separator}' 

set -g @window-status-current-left \
'#[fg=#{E:@prim-f-d},bg=default]\
#{@right-separator}\
#[bg=#{E:@prim-f-d},fg=#{E:@on-prim}]\
 #{?window_zoomed_flag,󱡴,#I} \
#[fg=#{E:@prim-f-d},bg=#{E:@prim}]\
#{@left-separator}' 

set -g window-status-format \
'#{E:@window-status-left}\
#[fg=#{E:@on-surf-v},bg=#{E:@surf-v}]\
 #[bold]#{E:@window-icon} \
#{E:@window-title} \
#[fg=#{E:@surf-v},bg=default]\
#{@right-edge}'

set -g window-status-current-format \
'#{E:@window-status-current-left}\
#[fg=#{E:@on-prim},bg=#{E:@prim}]\
 #[bold]#{E:@command-icon} \
#{E:@window-title} \
#[fg=#{E:@prim},bg=default]\
#{@right-edge}'

set -g status-right \
'#{E:@segment-session-duration}\
#{E:@segment-current-directory}\
#{E:@segment-git}\
#{E:@segment-command}\
#{E:@segment-user}\
#{E:@segment-host}'

set -g pane-border-style "fg=#{@noctalia_outline_variant}"
set -g pane-active-border-style "fg=#{@noctalia_primary}"

set -g message-style "fg=black,bg=yellow,align=centre"
set -g message-format \
"#[fg=yellow,bg=#{E:@surf}]#{@left-edge}\
#[fg=default,bg=yellow,fill=yellow,bold,align=centre] #{message} \
#[align=right,fg=yellow,bg=#{E:@surf}]#{@right-edge}"
