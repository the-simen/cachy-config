#Colors
set -g @prim '#{@noctalia_primary}'
set -g @on-prim '#{@noctalia_on_primary}'
set -g @prim-c '#{@noctalia_primary_container}'
set -g @on-prim-c '#{@noctalia_on_primary_container}'
set -g @prim-f '#{@noctalia_primary_fixed}'
set -g @on-prim-f '#{@noctalia_on_primary_fixed}'
set -g @prim-f-d '#{@noctalia_primary_fixed_dim}'
set -g @sec '#{@noctalia_secondary}'
set -g @on-sec '#{@noctalia_on_secondary}'
set -g @sec-c '#{@noctalia_secondary_container}'
set -g @sec-f '#{@noctalia_secondary_fixed}'
set -g @on-sec-f '#{@noctalia_on_secondary_fixed}'
set -g @on-sec-c '#{@noctalia_on_secondary_container}'
set -g @sec-f-d '#{@noctalia_secondary_fixed_dim}'
set -g @ter '#{@noctalia_tertiary}'
set -g @on-ter '#{@noctalia_on_tertiary}'
set -g @ter-c '#{@noctalia_tertiary_container}'
set -g @on-ter-c '#{@noctalia_on_tertiary_container}'
set -g @ter-f '#{@noctalia_tertiary_fixed}'
set -g @on-ter-f '#{@noctalia_on_tertiary_fixed}'
set -g @ter-f-d '#{@noctalia_tertiary_fixed_dim}'
set -g @surf '#{@noctalia_surface}'
set -g @on-surf '#{@noctalia_on_surface}'
set -g @surf-v '#{@noctalia_surface_variant}'
set -g @on-surf-v '#{@noctalia_on_surface_variant}'
set -g @surf-br '#{@noctalia_surface_bright}'

set -g @t-black '#{@noctalia_terminal_normal_black}'
set -g @t-red '#{@noctalia_terminal_normal_red}'
set -g @t-green '#{@noctalia_terminal_normal_green}'
set -g @t-yellow '#{@noctalia_terminal_normal_yellow}'
set -g @t-blue '#{@noctalia_terminal_normal_blue}'
set -g @t-magenta '#{@noctalia_terminal_normal_magenta}'
set -g @t-cyan '#{@noctalia_terminal_normal_cyan}'
set -g @t-white '#{@noctalia_terminal_normal_white}'
set -g @t-black-br '#{@noctalia_terminal_bright_black}'
set -g @t-red-br '#{@noctalia_terminal_bright_red}'
set -g @t-green-br '#{@noctalia_terminal_bright_green}'
set -g @t-yellow-br '#{@noctalia_terminal_bright_yellow}'
set -g @t-blue-br '#{@noctalia_terminal_bright_blue}'
set -g @t-magenta-br '#{@noctalia_terminal_bright_magenta}'
set -g @t-cyan-br '#{@noctalia_terminal_bright_cyan}'
set -g @t-white-br '#{@noctalia_terminal_bright_white}'

set -g @t-fg '#{@noctalia_terminal_foreground}'
set -g @t-bg '#{@noctalia_terminal_background}'

set -g @err '#{@noctalia_error}'
set -g @on-err '#{@noctalia_on_error}'

#Bar settings
set -g status on

set -g status-style "fg=white,bg=default"
set -g status-left-style "fg=white,bg=default"
set -g status-left-length 100
set -g status-right-length 100
set -g status-right-style "fg=white,bg=default"

set -g @left-edge ''
set -g @right-edge ''
set -g @left-separator ''
set -g @right-separator ''
set -g @block '█'

set -g @segment-session-normal \
'#[fg=#{E:@sec},bg=default]\
#{@left-edge}\
#[fg=#{E:@on-sec},bg=#{E:@sec}]\
 #S \
#[fg=#{E:@sec},bg=default]\
#{@left-separator}'

set -g @segment-session-prefix \
'#[fg=#{E:@err},bg=default]\
#{@left-edge}\
#[fg=#{E:@on-err},bg=#{E:@err}]\
  #S \
#[fg=#{E:@err},bg=default]\
#{@left-separator}'

set -g @segment-session \
'#{?client_prefix,#{E:@segment-session-prefix},#{E:@segment-session-normal}}'

set -g status-left '#{E:@segment-session}'

set -g @window-status-left \
'#[fg=#{E:@surf-br},bg=default]\
#{@right-separator}\
#[bg=#{E:@surf-br},fg=#{E:@on-surf}]\
 #{?window_zoomed_flag,󱡴,#I} \
#[fg=#{E:@surf-br},bg=#{E:@surf-v}]\
#{@left-separator}' 

set -g @window-status-current-left \
'#[fg=#{E:@prim-f-d},bg=default]\
#{@right-separator}\
#[bg=#{E:@prim-f-d},fg=#{E:@on-prim-f}]\
 #{?window_zoomed_flag,󱡴,#I} \
#[fg=#{E:@prim-f-d},bg=#{E:@prim}]\
#{@left-separator}' 

set -g @window-icon \
'#{?#{==:#{pane_current_command},nvim},,\
#{?#{==:#{pane_current_command},vim},,\
#{?#{==:#{pane_current_command},fish},󰈺,}}}'

set -g window-status-format \
'#{E:@window-status-left}\
#[fg=#{E:@on-surf-v},bg=#{E:@surf-v}]\
 #{E:@window-icon} #W \
#[fg=#{E:@surf-v},bg=default]\
#{@right-edge}'

set -g window-status-current-format \
'#{E:@window-status-current-left}\
#[fg=#{E:@on-prim},bg=#{E:@prim}]\
 #{E:@window-icon} #W \
#[fg=#{E:@prim},bg=default]\
#{@right-edge}'

set -g @session-duration \
'#[fg=#{E:@t-black-br},bg=default]\
#{@left-edge}\
#[fg=#{E:@on-surf},bg=#{E:@t-black-br}]\
 󰔟 #(~/.config/tmux/scripts/session-duration.sh "#{session_created}") \
#[fg=#{E:@t-black-br},bg=#{E:@surf-br}]\
#{@left-separator}'

set -g @current-directory \
'#[fg=#{E:@surf-br},bg=#{E:@t-cyan}]\
#{@left-separator}\
#[fg=black,bg=#{E:@t-cyan}]\
 󰉋 #{b:pane_current_path} \
#[fg=#{E:@surf-br},bg=#{E:@t-cyan}]\
#{@right-separator}'

set -g @segment-git '#(#{HOME}/.config/tmux/scripts/git-branch.sh "#{pane_current_path}")'

set -g @segment-host \
'#[fg=#{E:@surf-br},bg=#{E:@t-red}]\
#{@left-separator}\
#[fg=#{E:@t-black},bg=#{E:@t-red}]\
  #H \
#[fg=#{E:@t-red},bg=default]\
#{@right-edge}'

set -g @segment-separator \
'#[fg=#{E:@surf-br}]\
#{@block}'

set -g status-right \
'#{E:@session-duration}\
#{E:@segment-separator}\
#{E:@current-directory}\
#{E:@segment-separator}\
#{E:@segment-git}\
#{E:@segment-host}'

set -g pane-border-style "fg=#{@noctalia_outline_variant}"
set -g pane-active-border-style "fg=#{@noctalia_primary}"

set -g message-style "fg=black,bg=yellow"
set -g message-format \
"#[fg=yellow,bg=#{E:@surf}]#{@left-edge}\
#[fg=black,bg=yellow,fill=yellow] #{message} \
#[align=right,fg=yellow,bg=#{E:@surf}]#{@right-edge}"
