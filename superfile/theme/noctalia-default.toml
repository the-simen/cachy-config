# Default fallback palette (tracked in git).
# Generated counterpart is git-ignored; to refresh: render theme, then copy generated file over this one.
##############################################
#                                            #
#          Superfile — Noctalia Theme        #
#                                            #
##############################################

# Code Syntax Highlighting
code_syntax_highlight = "catppuccin-mocha"

# Full Screen
full_screen_fg = "#ddc7a1"
full_screen_bg = "#32302f"

# Gradient
gradient_color = [
  "#a9b665",
  "#ea6962"
]

# File Panel
file_panel_fg = "#ddc7a1"
file_panel_bg = "#32302f"
file_panel_border = "#7f7873"
file_panel_border_active = "#a9b665"
file_panel_top_directory_icon = "#a9b665"
file_panel_top_path = "#e78a4e"
file_panel_item_selected_fg = "#a9b665"
file_panel_item_selected_bg = "#3c3836"

# Footer
footer_fg = "#ddc7a1"
footer_bg = "#32302f"
footer_border = "#7f7873"
footer_border_active = "#a9b665"

# Sidebar
sidebar_fg = "#ddc7a1"
sidebar_bg = "#32302f"
sidebar_title = "#89b482"
sidebar_border = "#3c3836"
sidebar_border_active = "#a9b665"
sidebar_item_selected_fg = "#a9b665"
sidebar_item_selected_bg = "#3c3836"
sidebar_divider = "#7f7873"

# Modals
modal_fg = "#ddc7a1"
modal_bg = "#32302f"
modal_border_active = "#a9b665"
modal_cancel_fg = "#ddc7a1"
modal_cancel_bg = "#7f7873"
modal_confirm_fg = "#ddc7a1"
modal_confirm_bg = "#75360d"

# Help Menu
help_menu_hotkey = "#a9b665"
help_menu_title = "#89b482"

# Special
cursor = "#ddc7a1"
correct = "#a9b665"
error = "#ea6962"
hint = "#e78a4e"
cancel = "#7f7873"
