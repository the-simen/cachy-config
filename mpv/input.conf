# Кастомные бинды (дефолтные бинды mpv продолжают работать)
# Загрузка ВНЕШНИХ дорожек (ModernZ показывает только встроенные):
ctrl+s script-binding load_external/load-sub      # выбрать .srt/.ass/… через диалог
ctrl+a script-binding load_external/load-audio    # выбрать внешнюю аудиодорожку через диалог
# Контекстное меню ModernZ/mpv (по доке: MBTN_RIGHT, но пкм = пауза, поэтому вешаем на свободную скм)
MBTN_MID script-binding select/context-menu       # открыть контекстное меню
