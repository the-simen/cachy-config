##############################################
#                                            #
#          Superfile — Noctalia Theme        #
#                                            #
##############################################

# Code Syntax Highlighting
code_syntax_highlight = "catppuccin-mocha"

# Full Screen
full_screen_fg = "{{ colors.on_surface.default.hex }}"
full_screen_bg = "{{ colors.surface.default.hex }}"

# Gradient
gradient_color = [
  "{{ colors.primary.default.hex }}",
  "{{ colors.error.default.hex }}"
]

# File Panel
file_panel_fg = "{{ colors.on_surface.default.hex }}"
file_panel_bg = "{{ colors.surface.default.hex }}"
file_panel_border = "{{ colors.outline.default.hex }}"
file_panel_border_active = "{{ colors.primary.default.hex }}"
file_panel_top_directory_icon = "{{ colors.primary.default.hex }}"
file_panel_top_path = "{{ colors.secondary.default.hex }}"
file_panel_item_selected_fg = "{{ colors.primary.default.hex }}"
file_panel_item_selected_bg = "{{ colors.surface_container.default.hex }}"

# Footer
footer_fg = "{{ colors.on_surface.default.hex }}"
footer_bg = "{{ colors.surface.default.hex }}"
footer_border = "{{ colors.outline.default.hex }}"
footer_border_active = "{{ colors.primary.default.hex }}"

# Sidebar
sidebar_fg = "{{ colors.on_surface.default.hex }}"
sidebar_bg = "{{ colors.surface.default.hex }}"
sidebar_title = "{{ colors.tertiary.default.hex }}"
sidebar_border = "{{ colors.surface_container.default.hex }}"
sidebar_border_active = "{{ colors.primary.default.hex }}"
sidebar_item_selected_fg = "{{ colors.primary.default.hex }}"
sidebar_item_selected_bg = "{{ colors.surface_container.default.hex }}"
sidebar_divider = "{{ colors.outline.default.hex }}"

# Modals
modal_fg = "{{ colors.on_surface.default.hex }}"
modal_bg = "{{ colors.surface.default.hex }}"
modal_border_active = "{{ colors.primary.default.hex }}"
modal_cancel_fg = "{{ colors.on_surface.default.hex }}"
modal_cancel_bg = "{{ colors.outline.default.hex }}"
modal_confirm_fg = "{{ colors.on_surface.default.hex }}"
modal_confirm_bg = "{{ colors.secondary_container.default.hex }}"

# Help Menu
help_menu_hotkey = "{{ colors.primary.default.hex }}"
help_menu_title = "{{ colors.tertiary.default.hex }}"

# Special
cursor = "{{ colors.terminal_cursor.default.hex }}"
correct = "{{ colors.primary.default.hex }}"
error = "{{ colors.error.default.hex }}"
hint = "{{ colors.secondary.default.hex }}"
cancel = "{{ colors.outline.default.hex }}"
